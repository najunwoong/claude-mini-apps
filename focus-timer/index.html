<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포커스 타이머</title>
<style>
  :root {
    --bg: #1a1b26;
    --panel: #24263b;
    --accent: #7aa2f7;
    --accent-2: #f7768e;
    --text: #c0caf5;
    --text-dim: #565f89;
    --done: #9ece6a;
    /* 순수 검정 대신 배경 쪽으로 튼 그림자. 두 카드가 이 값을 그대로 공유한다. */
    --card-shadow: 0 10px 40px rgba(6, 7, 16, 0.45), 0 0 0 1px rgba(255,255,255,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .app { animation: card-in 0.4s ease-out; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .timer-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: var(--card-shadow);
  }
  .mode-switch {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .mode-btn {
    background: transparent;
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }
  .mode-btn:hover:not(.active) { border-color: var(--accent); color: var(--text); }
  /* 링 지름 240px, 반지름 88px(스트로크 폭 8px가 여유를 두고 들어가도록) 기준. */
  .timer-visual {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 8px auto 4px;
  }
  .progress-ring {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .progress-ring-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 8; }
  .progress-ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.25s linear;
    filter: drop-shadow(0 0 5px var(--accent));
  }
  .timer-visual-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .time-display {
    font-size: 56px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin: 8px 0 0;
    letter-spacing: 1px;
  }
  .session-label {
    color: var(--text-dim);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  @media (prefers-reduced-motion: reduce) {
    .progress-ring-fill { transition: none; }
    .app { animation: none; }
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.96); opacity: 1; }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--text-dim); }
  .pomodoro-count {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
  }
  .pomodoro-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
  }
  .pomodoro-dot.filled { background: var(--accent-2); }

  .todo-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
    box-shadow: var(--card-shadow);
  }
  .todo-card h3 {
    margin: 0 0 12px 0;
    font-size: 15px;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .todo-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .todo-input-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--text-dim);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .todo-input-row input:focus { border-color: var(--accent); }
  .todo-input-row button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-weight: 700;
    cursor: pointer;
    font-size: 18px;
    transition: transform 0.1s, opacity 0.2s;
  }
  /* .btn-primary와 같은 액센트 배경을 쓰는 만큼, 눌림/hover 반응도 맞춘다 */
  .todo-input-row button:hover { opacity: 0.88; }
  .todo-input-row button:active { transform: scale(0.94); opacity: 1; }
  ul.todo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    padding: 10px 12px;
    border-radius: 10px;
  }
  .todo-item .check {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--text-dim);
    background: transparent;
    color: inherit;
    padding: 0;
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: border-color 0.15s;
  }
  .todo-item .check:hover { border-color: var(--accent); }
  .todo-item.done .check { background: var(--done); border-color: var(--done); color: var(--bg); }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-dim); }
  .todo-text { flex: 1; font-size: 14px; word-break: break-word; }
  .todo-item .del {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 16px; padding: 2px 6px;
  }
  .todo-item .del:hover { color: var(--accent-2); }
  .empty-msg { color: var(--text-dim); font-size: 13px; text-align: center; padding: 12px 0; }

  .pomodoro-label {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 8px;
    min-height: 15px;
  }
  .toast {
    margin-top: 16px;
    background: rgba(158, 206, 106, 0.12);
    border: 1px solid var(--done);
    color: var(--done);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
  }
  .toast[hidden] { display: none; }

  /* 키보드 사용자에게 현재 포커스 위치를 보이게 한다 */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="timer-card">
    <div class="mode-switch">
      <button type="button" class="mode-btn active" data-mode="focus" data-min="25" aria-pressed="true">집중 25</button>
      <button type="button" class="mode-btn" data-mode="short" data-min="5" aria-pressed="false">짧은휴식 5</button>
      <button type="button" class="mode-btn" data-mode="long" data-min="15" aria-pressed="false">긴휴식 15</button>
    </div>
    <div class="timer-visual">
      <svg class="progress-ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="progress-ring-track" cx="100" cy="100" r="88"></circle>
        <circle class="progress-ring-fill" id="ringFill" cx="100" cy="100" r="88"></circle>
      </svg>
      <div class="timer-visual-text">
        <div class="session-label" id="sessionLabel">집중 시간</div>
        <div class="time-display" id="timeDisplay" role="timer" aria-live="off">25:00</div>
      </div>
    </div>
    <div class="controls">
      <button type="button" class="btn btn-primary" id="startBtn">시작</button>
      <button type="button" class="btn btn-secondary" id="resetBtn">리셋</button>
    </div>
    <div class="pomodoro-count" id="pomodoroCount"></div>
    <div class="pomodoro-label" id="pomodoroLabel"></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <div class="todo-card">
    <h3>할 일</h3>
    <div class="todo-input-row">
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" maxlength="120">
      <button type="button" id="addBtn" aria-label="할 일 추가">+</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
  </div>
</div>

<script>
(function() {
  const timeDisplay = document.getElementById('timeDisplay');
  const sessionLabel = document.getElementById('sessionLabel');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modeBtns = document.querySelectorAll('.mode-btn');
  const pomodoroCount = document.getElementById('pomodoroCount');
  const pomodoroLabel = document.getElementById('pomodoroLabel');
  const toast = document.getElementById('toast');
  const ringFill = document.getElementById('ringFill');

  // 반지름 88(마크업의 r="88")에 맞춘 원둘레. 남은 시간 비율만큼 링을 채운다.
  const RING_C = 2 * Math.PI * 88;
  ringFill.style.strokeDasharray = String(RING_C);

  const LABELS = { focus: '집중 시간', short: '짧은 휴식', long: '긴 휴식' };

  // localStorage는 프라이빗 모드나 사이트 데이터 차단 환경에서 예외를 던진다.
  // 실패해도 앱이 죽지 않도록 감싸고 기본값으로 폴백한다.
  const store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    }
  };

  let mode = 'focus';
  let totalSeconds = 25 * 60;
  let remaining = totalSeconds;
  let running = false;
  let timerId = null;
  let endTime = null;

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function toCount(v) {
    return (typeof v === 'number' && isFinite(v) && v >= 0) ? Math.floor(v) : 0;
  }

  // 기록은 { date, count } 형태로 저장하고 날짜가 바뀌면 0부터 다시 센다.
  let pomodoroDate = todayKey();
  let completedPomodoros = 0;
  const savedPomodoros = store.get('ft_pomodoros', null);
  if (typeof savedPomodoros === 'number') {
    completedPomodoros = toCount(savedPomodoros);            // 이전 버전 형식을 이어받는다
  } else if (savedPomodoros && typeof savedPomodoros === 'object' && savedPomodoros.date === pomodoroDate) {
    completedPomodoros = toCount(savedPomodoros.count);
  }

  function addPomodoro() {
    const today = todayKey();
    if (today !== pomodoroDate) {          // 자정을 넘겨 세션이 끝난 경우
      pomodoroDate = today;
      completedPomodoros = 0;
    }
    completedPomodoros++;
    store.set('ft_pomodoros', { date: pomodoroDate, count: completedPomodoros });
    renderPomodoros();
  }

  function fmt(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function renderPomodoros() {
    pomodoroCount.innerHTML = '';
    const filled = Math.min(completedPomodoros, 8);
    for (let i = 0; i < 8; i++) {
      const dot = document.createElement('div');
      dot.className = 'pomodoro-dot' + (i < filled ? ' filled' : '');
      pomodoroCount.appendChild(dot);
    }
    pomodoroLabel.textContent = completedPomodoros > 0
      ? '오늘 ' + completedPomodoros + '회 완료'
      : '';
  }

  const BASE_TITLE = '포커스 타이머';

  function updateDisplay() {
    timeDisplay.textContent = fmt(remaining);
    document.title = running ? fmt(remaining) + ' · ' + BASE_TITLE : BASE_TITLE;
    const frac = totalSeconds > 0 ? Math.min(1, Math.max(0, remaining / totalSeconds)) : 0;
    ringFill.style.strokeDashoffset = String(RING_C * (1 - frac));
  }

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 8000);
  }

  function hideToast() {
    clearTimeout(toastTimer);
    toast.hidden = true;
  }

  // AudioContext는 개수 제한이 있으므로 하나만 만들어 재사용한다.
  let audioCtx = null;
  function beep() {
    try {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      if (!audioCtx) audioCtx = new Ctor();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
      osc.start(); osc.stop(audioCtx.currentTime + 0.8);
    } catch (e) {}
  }

  function remainingFromClock() {
    return Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
  }

  function stop() {
    clearInterval(timerId);
    timerId = null;
    endTime = null;
    running = false;
    startBtn.textContent = '시작';
    updateDisplay();
  }

  function tick() {
    // 남은 초를 직접 감소시키지 않고 종료 시각과의 차이로 계산한다.
    // 백그라운드 탭에서 인터벌이 느려지거나 멈춰도 표시 시간은 실제 경과와 일치한다.
    remaining = remainingFromClock();
    updateDisplay();
    if (remaining <= 0) {
      const finished = mode;
      stop();
      if (finished === 'focus') addPomodoro();
      beep();
      showToast((finished === 'focus' ? '집중 시간' : '휴식 시간') + '이 끝났습니다!');
    }
  }

  startBtn.addEventListener('click', () => {
    if (running) {
      remaining = remainingFromClock();
      stop();
      updateDisplay();
    } else {
      if (remaining <= 0) remaining = totalSeconds;
      hideToast();
      running = true;
      startBtn.textContent = '일시정지';
      endTime = Date.now() + remaining * 1000;
      // 1초보다 촘촘히 확인해 표시 지연을 줄인다. 정확도는 endTime이 보장한다.
      timerId = setInterval(tick, 250);
    }
  });

  resetBtn.addEventListener('click', () => {
    stop();
    hideToast();
    remaining = totalSeconds;
    updateDisplay();
  });

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      modeBtns.forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      mode = btn.dataset.mode;
      sessionLabel.textContent = LABELS[mode];
      totalSeconds = parseInt(btn.dataset.min, 10) * 60;
      stop();
      hideToast();
      remaining = totalSeconds;
      updateDisplay();
    });
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && running) tick();
  });

  updateDisplay();
  renderPomodoros();

  // Todo list
  const todoInput = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');
  let todos = store.get('ft_todos', []);
  if (!Array.isArray(todos)) todos = [];
  todos = todos
    .filter(t => t && typeof t.text === 'string')
    .map(t => ({ text: t.text, done: !!t.done }));

  function saveTodos() {
    store.set('ft_todos', todos);
  }

  function renderTodos() {
    todoList.innerHTML = '';
    if (todos.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty-msg';
      li.textContent = '할 일이 없습니다. 하나 추가해보세요!';
      todoList.appendChild(li);
      return;
    }
    todos.forEach((todo, idx) => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.done ? ' done' : '');
      const check = document.createElement('button');
      check.type = 'button';
      check.className = 'check';
      check.textContent = todo.done ? '✓' : '';
      check.setAttribute('aria-pressed', todo.done ? 'true' : 'false');
      check.setAttribute('aria-label', todo.text + ' 완료 표시');
      check.addEventListener('click', () => {
        todos[idx].done = !todos[idx].done;
        saveTodos();
        renderTodos();
      });
      const text = document.createElement('div');
      text.className = 'todo-text';
      text.textContent = todo.text;
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '✕';
      del.setAttribute('aria-label', todo.text + ' 삭제');
      del.addEventListener('click', () => {
        todos.splice(idx, 1);
        saveTodos();
        renderTodos();
      });
      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(del);
      todoList.appendChild(li);
    });
  }

  function addTodo() {
    const val = todoInput.value.trim();
    if (!val) return;
    todos.push({ text: val, done: false });
    todoInput.value = '';
    saveTodos();
    renderTodos();
  }

  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  renderTodos();
})();
</script>
</body>
</html>
