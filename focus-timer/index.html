<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포커스 타이머</title>
<style>
  :root {
    --bg: #1a1b26;
    --panel: #24263b;
    --accent: #7aa2f7;
    --accent-2: #f7768e;
    --text: #c0caf5;
    --text-dim: #565f89;
    --done: #9ece6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .timer-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .mode-switch {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .mode-btn {
    background: transparent;
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }
  .time-display {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin: 12px 0;
    letter-spacing: 2px;
  }
  .session-label {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 4px;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--text-dim); }
  .progress-ring-bg { opacity: 0.15; }
  .pomodoro-count {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
  }
  .pomodoro-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
  }
  .pomodoro-dot.filled { background: var(--accent-2); }

  .todo-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
  }
  .todo-card h3 {
    margin: 0 0 12px 0;
    font-size: 15px;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .todo-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .todo-input-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--text-dim);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .todo-input-row input:focus { border-color: var(--accent); }
  .todo-input-row button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-weight: 700;
    cursor: pointer;
    font-size: 18px;
  }
  ul.todo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    padding: 10px 12px;
    border-radius: 10px;
  }
  .todo-item .check {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--text-dim);
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .todo-item.done .check { background: var(--done); border-color: var(--done); color: var(--bg); }
  .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-dim); }
  .todo-text { flex: 1; font-size: 14px; word-break: break-word; }
  .todo-item .del {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 16px; padding: 2px 6px;
  }
  .todo-item .del:hover { color: var(--accent-2); }
  .empty-msg { color: var(--text-dim); font-size: 13px; text-align: center; padding: 12px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="timer-card">
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="focus" data-min="25">집중 25</button>
      <button class="mode-btn" data-mode="short" data-min="5">짧은휴식 5</button>
      <button class="mode-btn" data-mode="long" data-min="15">긴휴식 15</button>
    </div>
    <div class="session-label" id="sessionLabel">집중 시간</div>
    <div class="time-display" id="timeDisplay">25:00</div>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn">시작</button>
      <button class="btn btn-secondary" id="resetBtn">리셋</button>
    </div>
    <div class="pomodoro-count" id="pomodoroCount"></div>
  </div>

  <div class="todo-card">
    <h3>할 일</h3>
    <div class="todo-input-row">
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" maxlength="120">
      <button id="addBtn">+</button>
    </div>
    <ul class="todo-list" id="todoList"></ul>
  </div>
</div>

<script>
(function() {
  const timeDisplay = document.getElementById('timeDisplay');
  const sessionLabel = document.getElementById('sessionLabel');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modeBtns = document.querySelectorAll('.mode-btn');
  const pomodoroCount = document.getElementById('pomodoroCount');

  const LABELS = { focus: '집중 시간', short: '짧은 휴식', long: '긴 휴식' };

  let mode = 'focus';
  let totalSeconds = 25 * 60;
  let remaining = totalSeconds;
  let running = false;
  let timerId = null;
  let completedPomodoros = parseInt(localStorage.getItem('ft_pomodoros') || '0', 10);

  function fmt(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function renderPomodoros() {
    pomodoroCount.innerHTML = '';
    const todayCount = completedPomodoros % 8 || (completedPomodoros > 0 ? 8 : 0);
    for (let i = 0; i < 8; i++) {
      const dot = document.createElement('div');
      dot.className = 'pomodoro-dot' + (i < todayCount ? ' filled' : '');
      pomodoroCount.appendChild(dot);
    }
  }

  function updateDisplay() {
    timeDisplay.textContent = fmt(remaining);
    document.title = fmt(remaining) + ' · 포커스 타이머';
  }

  function tick() {
    remaining--;
    updateDisplay();
    if (remaining <= 0) {
      clearInterval(timerId);
      running = false;
      startBtn.textContent = '시작';
      if (mode === 'focus') {
        completedPomodoros++;
        localStorage.setItem('ft_pomodoros', completedPomodoros);
        renderPomodoros();
      }
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.start(); osc.stop(audioCtx.currentTime + 0.8);
      } catch(e) {}
      alert((mode === 'focus' ? '집중 시간' : '휴식 시간') + '이 끝났습니다!');
    }
  }

  startBtn.addEventListener('click', () => {
    if (running) {
      clearInterval(timerId);
      running = false;
      startBtn.textContent = '시작';
    } else {
      running = true;
      startBtn.textContent = '일시정지';
      timerId = setInterval(tick, 1000);
    }
  });

  resetBtn.addEventListener('click', () => {
    clearInterval(timerId);
    running = false;
    startBtn.textContent = '시작';
    remaining = totalSeconds;
    updateDisplay();
  });

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      modeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      sessionLabel.textContent = LABELS[mode];
      totalSeconds = parseInt(btn.dataset.min, 10) * 60;
      remaining = totalSeconds;
      clearInterval(timerId);
      running = false;
      startBtn.textContent = '시작';
      updateDisplay();
    });
  });

  updateDisplay();
  renderPomodoros();

  // Todo list
  const todoInput = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');
  let todos = JSON.parse(localStorage.getItem('ft_todos') || '[]');

  function saveTodos() {
    localStorage.setItem('ft_todos', JSON.stringify(todos));
  }

  function renderTodos() {
    todoList.innerHTML = '';
    if (todos.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty-msg';
      li.textContent = '할 일이 없습니다. 하나 추가해보세요!';
      todoList.appendChild(li);
      return;
    }
    todos.forEach((todo, idx) => {
      const li = document.createElement('li');
      li.className = 'todo-item' + (todo.done ? ' done' : '');
      const check = document.createElement('div');
      check.className = 'check';
      check.textContent = todo.done ? '✓' : '';
      check.addEventListener('click', () => {
        todos[idx].done = !todos[idx].done;
        saveTodos();
        renderTodos();
      });
      const text = document.createElement('div');
      text.className = 'todo-text';
      text.textContent = todo.text;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.addEventListener('click', () => {
        todos.splice(idx, 1);
        saveTodos();
        renderTodos();
      });
      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(del);
      todoList.appendChild(li);
    });
  }

  function addTodo() {
    const val = todoInput.value.trim();
    if (!val) return;
    todos.push({ text: val, done: false });
    todoInput.value = '';
    saveTodos();
    renderTodos();
  }

  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  renderTodos();
})();
</script>
</body>
</html>
